<!doctype html>
<html lang="pl" data-theme="papier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edytor PDF</title>
<!-- tryb jasny/ciemny ustawiany przed narysowaniem strony, żeby nie mignęła jasna wersja -->
<script>try{var m=localStorage.getItem('ep-theme');document.documentElement.dataset.theme=m||(matchMedia('(prefers-color-scheme: dark)').matches?'grafit':'papier')}catch(e){}</script>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/bundle.css">
<script src="design/bundle.js"></script>
<style>
/* ---- czcionki do nowego tekstu (te same, które trafiają do PDF-a) ---- */
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-Bold.ttf);font-weight:700;font-style:normal}
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-BoldItalic.ttf);font-weight:700;font-style:italic}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-Bold.ttf);font-weight:700;font-style:normal}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-BoldItalic.ttf);font-weight:700;font-style:italic}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-Bold.ttf);font-weight:700;font-style:normal}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-BoldItalic.ttf);font-weight:700;font-style:italic}
/* ---- rzeczy spoza systemu: okno, dokument, obiekty, menu, dialogi – tylko tokeny z tokens.css ---- */
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;user-select:none}
.ep-shell{flex:1}
#tools{flex-wrap:nowrap}
.ep-appbar .ep-input{width:260px}
.ep-input__count{flex:none;color:var(--on-chrome-muted);font:500 11px/16px var(--font-mono)}
.ep-docstate--dirty{color:var(--on-chrome)}
.ep-sidebar:not(.on),.ep-inspector:not(.on){display:none}
.ep-sidebar .pane{flex:1;min-height:0;overflow:auto;padding:var(--space-4)}
.ep-sidebar .pane[hidden]{display:none}
#pThumbs.pane{padding:var(--space-4)}
/* miniatury stron (rysowane w canvas) */
.ep-thumb__page:has(canvas){padding:0;overflow:hidden;aspect-ratio:auto}
.ep-thumb__page canvas{display:block;width:112px}
.ep-thumb[data-sel="1"] .ep-thumb__page{box-shadow:0 0 0 2px var(--warning),var(--shadow-raise)}
.ep-thumb[data-sel="1"] .ep-thumb__num{background:var(--warning);color:var(--on-accent)}
.ep-thumb.drag{opacity:.4}.ep-thumb.over .ep-thumb__page{box-shadow:0 -4px 0 var(--accent),0 0 0 1px var(--line)}
/* obszar roboczy i strona PDF */
.ep-canvas{display:block;padding:0;outline:none}
.ep-canvas .pages{padding:var(--space-8) var(--space-6) 80px;display:flex;flex-direction:column;align-items:center;gap:var(--space-6);min-width:min-content}
.page{position:relative;background:#fff;box-shadow:var(--shadow-page);flex-shrink:0}
.page canvas.pg{display:block}
.page .tl{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:.25}
.page .tl span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0}
.page .tl ::selection{background:var(--annot-blue)}
.page .tl .hit{background:var(--annot-yellow);color:transparent;opacity:1;border-radius:2px}
.page .txl,.page .lay{position:absolute;inset:0}.page .txl{pointer-events:none}
.page.rendering::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.5)}
.ep-canvas.hand .page{cursor:grab}.ep-canvas.hand.dragging .page{cursor:grabbing}
.ep-canvas.drawing .page{cursor:crosshair}
/* wiersz tekstu w trybie Edytuj tekst: pod kursorem edit-fill + obrys, w edycji obrys 2px */
.page .tx{position:absolute;border-radius:2px;cursor:text;pointer-events:none;transition:background-color .1s,box-shadow .1s}
.page.edit-text .tx{pointer-events:auto}
.page.edit-text .tx:hover{background:var(--edit-fill);box-shadow:0 0 0 1px var(--edit-line)}
.page .tx.moving{background:var(--edit-fill);box-shadow:0 0 0 2px var(--edit-line);cursor:move;z-index:5}
.inl{position:absolute;outline:2px solid var(--edit-line);outline-offset:0;background:#fff;color:var(--paper-ink);caret-color:var(--edit-line);white-space:pre;z-index:20;padding:0;margin:0;line-height:1;min-width:20px;transform-origin:0 0;user-select:text;border-radius:2px}
/* obiekty na stronie (warstwa) */
.page .ob{position:absolute;transform-origin:0 0}
.page .ob.sel{outline:1.5px solid var(--selected)}
.page .ob .h{position:absolute;width:10px;height:10px;background:var(--surface-raised);border:1.5px solid var(--selected);border-radius:2px;display:none}
.page .ob.sel .h{display:block}
.page .ob .h.nw{left:-6px;top:-6px;cursor:nwse-resize}.page .ob .h.ne{right:-6px;top:-6px;cursor:nesw-resize}
.page .ob .h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.page .ob .h.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.page .ob .h.e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}.page .ob .h.w{left:-6px;top:calc(50% - 5px);cursor:ew-resize}
.page .ob.text .ed{outline:0;white-space:pre-wrap;word-break:break-word;width:100%;height:100%;overflow:hidden;cursor:text;user-select:text}
.page .ob img{width:100%;height:100%;display:block;pointer-events:none}
.page .ob svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.page .ob.note{width:22px;height:22px}.page .ob.note svg{pointer-events:auto;cursor:pointer}
.page .ob.field{border:1px solid var(--line-strong);background:rgba(168,205,251,.35)}
.page .ob.field.chk::after{content:"☐";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#345}
.rub{position:absolute;border:1px dashed var(--selected);background:var(--edit-fill);pointer-events:none}
.ep-canvas.dropping::after{content:"Upuść plik PDF tutaj";pointer-events:none;position:fixed;inset:8px;border:2px dashed var(--accent);border-radius:var(--radius-lg);background:var(--edit-fill);display:flex;align-items:center;justify-content:center;font:600 20px/28px var(--font-sans);color:var(--accent-ink);z-index:50}
/* ekran powitalny */
.welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--ink-muted);background:var(--canvas)}
.welcome .box{background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-lg);padding:40px 56px;text-align:center;max-width:540px;box-shadow:var(--shadow-page);color:var(--ink)}
.welcome h1{font:600 22px/28px var(--font-sans);margin:0 0 8px}
.welcome .btns{display:flex;gap:var(--space-2);justify-content:center;flex-wrap:wrap;margin-top:var(--space-5)}
.welcome .m{color:var(--ink-muted);font-size:12px;margin-top:var(--space-3)}
.welcome .rec{margin-top:var(--space-4);font-size:12px;text-align:left}.welcome .rec b{display:block;color:var(--ink-muted);font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.welcome .rec a{display:block;color:var(--accent-ink);cursor:pointer;text-decoration:none;padding:3px 0;font-weight:500}.welcome .rec a:hover{text-decoration:underline}
/* panel właściwości: treść generowana z kodu (h3 = tytuł sekcji, label = etykieta pola) */
.ep-inspector__body h3{margin:0;color:var(--ink-muted);font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase}
.ep-inspector__body h3+*{margin-top:0}
.ep-inspector__body label{display:block;color:var(--ink-muted);font:500 12px/16px var(--font-sans);margin:var(--space-3) 0 6px}
.ep-inspector__body input:not([type=checkbox]):not([type=color]),.ep-inspector__body select,.ep-inspector__body textarea{width:100%;height:var(--control-h);padding:0 var(--space-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:400 13px/20px var(--font-sans)}
.ep-inspector__body textarea{height:auto;min-height:72px;padding:6px var(--space-2);resize:vertical}
.ep-inspector__body input[type=number]{font:500 12px/16px var(--font-mono)}
.ep-inspector__body input[type=color]{width:100%;height:var(--control-h);padding:3px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised)}
.ep-inspector__body input:focus-visible,.ep-inspector__body select:focus-visible,.ep-inspector__body textarea:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.ep-inspector__body .row{display:flex;gap:var(--space-2)}.ep-inspector__body .row>*{flex:1;min-width:0}
.ep-inspector__body button{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);width:100%;height:var(--control-h);margin-top:var(--space-2);padding:0 var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:600 13px/20px var(--font-sans);cursor:pointer}
.ep-inspector__body button:hover{background:var(--surface-hover)}
.ep-inspector__body button.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.ep-inspector__body button.go{border-color:var(--ink-muted)}
.ep-inspector__body button.x{color:var(--danger)}.ep-inspector__body button.x:hover{background:var(--danger-soft)}
.ep-inspector__body .m{padding:var(--space-3);border-radius:var(--radius-md);background:var(--surface-sunken);border:1px solid var(--line);color:var(--ink-muted);font:400 12px/18px var(--font-sans);margin-top:var(--space-3)}
.ep-inspector__body .m b{color:var(--ink);font-weight:600}
/* panel komentarzy i formularza */
.com{padding:var(--space-2) var(--space-3);border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:var(--space-2);background:var(--surface-raised);cursor:pointer;font:400 12px/18px var(--font-sans);color:var(--ink)}
.com:hover{border-color:var(--line-strong)}.com b{display:block;font:500 11px/16px var(--font-mono);color:var(--ink-muted)}
.fld{display:flex;gap:var(--space-2);align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font:400 12px/18px var(--font-sans)}
.fld span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-muted)}
.fld input:not([type=checkbox]),.fld select{flex:1.3;min-width:0;height:var(--control-h-sm);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:0 6px;background:var(--surface-raised);color:var(--ink);font:400 12px/16px var(--font-sans)}
.pane .m,.pane>div:first-child:last-child{color:var(--ink-muted);font-size:12px}
/* menu rozwijane (pod paskiem aplikacji) */
.menu{position:fixed;display:none;min-width:240px;padding:4px;background:var(--surface-raised);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow-pop);color:var(--ink);z-index:300}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:var(--space-3);width:100%;height:30px;padding:0 var(--space-3);border:0;border-radius:var(--radius-sm);background:transparent;color:var(--ink);font:500 13px/20px var(--font-sans);text-align:left;cursor:pointer;white-space:nowrap}
.menu button:hover:not(:disabled){background:var(--surface-hover)}.menu button:disabled{color:var(--ink-disabled);cursor:default}
.menu button span.k{margin-left:auto;color:var(--ink-muted);font:500 11px/16px var(--font-mono)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px var(--space-2)}
.menu .lab{padding:6px var(--space-3) 2px;color:var(--ink-muted);font:600 11px/16px var(--font-sans);letter-spacing:.06em;text-transform:uppercase}
.menu .ep-thememode{margin:2px 4px 4px}
/* okna dialogowe */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.box{background:var(--surface-raised);color:var(--ink);border-radius:var(--radius-lg);width:min(600px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--shadow-pop);border:1px solid var(--line)}
.box h3{margin:0;padding:14px 20px;border-bottom:1px solid var(--line);font:600 15px/20px var(--font-sans)}
.box .b{padding:14px 20px;overflow:auto;user-select:text}
.box .f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:var(--space-2);justify-content:flex-end}
.box button{display:inline-flex;align-items:center;justify-content:center;height:var(--control-h);padding:0 var(--space-3);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:600 13px/20px var(--font-sans);cursor:pointer}
.box button:hover{background:var(--surface-hover)}
.box button.go{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.box button.go:hover{background:var(--accent-hover)}
.box button.x{color:var(--danger)}.box button.x:hover{background:var(--danger-soft)}
.box button.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.box label{display:block;color:var(--ink-muted);font:500 12px/16px var(--font-sans);margin:var(--space-3) 0 4px}
.box input:not([type=checkbox]),.box select,.box textarea{width:100%;height:var(--control-h);padding:0 var(--space-2);border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface-raised);color:var(--ink);font:400 13px/20px var(--font-sans)}
.box input[type=color]{padding:3px}.box textarea{height:auto;min-height:90px;padding:6px var(--space-2);resize:vertical}
.box input:focus-visible,.box select:focus-visible,.box textarea:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.box .row{display:flex;gap:var(--space-3)}.box .row>*{flex:1}
.box .m{color:var(--ink-muted);font-size:12px}
.box canvas.sig{border:1px solid var(--line-strong);border-radius:var(--radius-md);background:#fff;width:100%;cursor:crosshair;touch-action:none}
.box .tabs{display:flex;gap:var(--space-1);margin-bottom:var(--space-3)}.box .tabs button{flex:1}
.box p{margin:0 0 10px}.box ul{margin:0;padding-left:20px}
.ep-kbd.kbd,.kbd{display:inline-block;min-width:22px;padding:0 5px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:var(--radius-xs);background:var(--surface-raised);color:var(--ink);font:500 11px/16px var(--font-mono);text-align:center;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--tooltip);color:var(--on-tooltip);padding:8px 14px;border-radius:var(--radius-md);z-index:500;box-shadow:var(--shadow-pop);max-width:80vw;font:500 12px/16px var(--font-sans);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.err{background:var(--danger);color:#fff}
@media print{body>*{display:none!important}}
</style>
<script id="s-pdflib">/*PDFLIB*/</script>
<script id="s-fontkit">/*FONTKIT*/</script>
<script id="s-pdfjs">/*PDFJS*/</script>
<script id="s-worker">/*WORKER*/</script>
<script id="s-jszip">/*JSZIP*/</script>
</head>
<body>
<div class="ep-shell">
<header class="ep-appbar top">
  <span class="ep-appbar__brand">Edytor PDF</span>
  <nav class="ep-menubar" aria-label="Menu">
    <button class="ep-menu" data-menu="mPlik" aria-expanded="false">Plik</button>
    <button class="ep-menu" data-menu="mEdycja" aria-expanded="false">Edycja</button>
    <button class="ep-menu" data-menu="mWidok" aria-expanded="false">Widok</button>
    <button class="ep-menu" data-menu="mStrony" aria-expanded="false">Strony</button>
    <button class="ep-menu" data-menu="mNarz" aria-expanded="false">Narzędzia</button>
    <button class="ep-menu" data-menu="mPomoc" aria-expanded="false">Pomoc</button>
  </nav>
  <div class="ep-appbar__doc"><span class="ep-docname" id="fileName"></span><span class="ep-docstate" id="docState" hidden></span></div>
  <div class="ep-appbar__actions" id="appActions">
    <label class="ep-input ep-input--chrome"><svg class="ep-icon ep-icon--sm" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="search" placeholder="Szukaj w dokumencie…" aria-label="Szukaj w dokumencie"><span class="ep-input__count" id="searchN"></span><span class="ep-kbd">Ctrl F</span></label>
    <button class="ep-iconbtn ep-themetoggle" data-ep-theme-toggle aria-pressed="false" aria-label="Tryb ciemny" title="Tryb ciemny"><svg class="ep-icon ep-themetoggle__moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="ep-icon ep-themetoggle__sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
    <span class="ep-appbar__divider" aria-hidden="true"></span>
    <button class="ep-iconbtn" id="bUndo" aria-label="Cofnij" title="Cofnij (Ctrl Z)" disabled><svg class="ep-icon" aria-hidden="true"><use href="#i-undo"/></svg></button>
    <button class="ep-iconbtn" id="bRedo" aria-label="Ponów" title="Ponów (Ctrl Y)" disabled><svg class="ep-icon" aria-hidden="true"><use href="#i-redo"/></svg></button>
    <button class="ep-btn ep-btn--primary" id="bSave" style="margin-left:4px" disabled>Zapisz</button>
  </div>
</header>
<div class="ep-toolbar" id="tools" role="toolbar" aria-label="Narzędzia">
  <div class="ep-toolgroup" role="group" aria-label="Wybór">
    <button class="ep-tool t" data-tool="select" aria-pressed="true" title="Zaznacz (V) – przesuwanie i zmiana obiektów"><svg class="ep-icon" aria-hidden="true"><use href="#i-select"/></svg><span>Zaznacz</span></button>
    <button class="ep-tool t" data-tool="hand" aria-pressed="false" title="Łapka (H) – przesuwanie widoku"><svg class="ep-icon" aria-hidden="true"><use href="#i-hand"/></svg><span>Łapka</span></button>
  </div>
  <span class="ep-toolbar__sep" aria-hidden="true"></span>
  <div class="ep-toolgroup" role="group" aria-label="Treść">
    <button class="ep-tool t" data-tool="edittext" aria-pressed="false" title="Edytuj tekst (T) – zmiana istniejącego tekstu"><svg class="ep-icon" aria-hidden="true"><use href="#i-edit-text"/></svg><span>Edytuj tekst</span></button>
    <button class="ep-tool t" data-tool="text" aria-pressed="false" title="Dodaj tekst (N)"><svg class="ep-icon" aria-hidden="true"><use href="#i-add-text"/></svg><span>Dodaj tekst</span></button>
    <button class="ep-tool t" data-tool="image" aria-pressed="false" title="Obraz (I) – PNG lub JPG"><svg class="ep-icon" aria-hidden="true"><use href="#i-image"/></svg><span>Obraz</span></button>
    <button class="ep-tool t" data-tool="sig" aria-pressed="false" title="Podpis – narysuj, wpisz albo wczytaj obraz"><svg class="ep-icon" aria-hidden="true"><use href="#i-signature"/></svg><span>Podpis</span></button>
  </div>
  <span class="ep-toolbar__sep" aria-hidden="true"></span>
  <div class="ep-toolgroup" role="group" aria-label="Adnotacje">
    <button class="ep-tool t" data-tool="hl" aria-pressed="false" title="Zakreśl – zaznacz tekst myszą"><svg class="ep-icon" aria-hidden="true"><use href="#i-highlight"/></svg><span>Zakreśl</span></button>
    <button class="ep-tool t" data-tool="ul" aria-pressed="false" title="Podkreśl – zaznacz tekst myszą"><svg class="ep-icon" aria-hidden="true"><use href="#i-underline"/></svg><span>Podkreśl</span></button>
    <button class="ep-tool t" data-tool="st" aria-pressed="false" title="Przekreśl – zaznacz tekst myszą"><svg class="ep-icon" aria-hidden="true"><use href="#i-strike"/></svg><span>Przekreśl</span></button>
    <button class="ep-tool t" data-tool="note" aria-pressed="false" title="Komentarz (K)"><svg class="ep-icon" aria-hidden="true"><use href="#i-comment"/></svg><span>Komentarz</span></button>
  </div>
  <span class="ep-toolbar__sep" aria-hidden="true"></span>
  <div class="ep-toolgroup" role="group" aria-label="Kształty">
    <button class="ep-tool t" data-tool="draw" aria-pressed="false" title="Rysuj (D)"><svg class="ep-icon" aria-hidden="true"><use href="#i-draw"/></svg><span>Rysuj</span></button>
    <button class="ep-tool t" data-tool="rect" aria-pressed="false" title="Prostokąt (R)"><svg class="ep-icon" aria-hidden="true"><use href="#i-rect"/></svg><span>Prostokąt</span></button>
    <button class="ep-tool t" data-tool="ellipse" aria-pressed="false" title="Elipsa (E)"><svg class="ep-icon" aria-hidden="true"><use href="#i-ellipse"/></svg><span>Elipsa</span></button>
    <button class="ep-tool t" data-tool="line" aria-pressed="false" title="Linia (L)"><svg class="ep-icon" aria-hidden="true"><use href="#i-line"/></svg><span>Linia</span></button>
    <button class="ep-tool t" data-tool="arrow" aria-pressed="false" title="Strzałka"><svg class="ep-icon" aria-hidden="true"><use href="#i-arrow"/></svg><span>Strzałka</span></button>
  </div>
  <span class="ep-toolbar__sep" aria-hidden="true"></span>
  <div class="ep-toolgroup" role="group" aria-label="Usuwanie">
    <button class="ep-tool t" data-tool="white" aria-pressed="false" title="Wymaż (W) – zakryj obszar białym"><svg class="ep-icon" aria-hidden="true"><use href="#i-erase"/></svg><span>Wymaż</span></button>
    <button class="ep-tool t ep-tool--danger" data-tool="redact" aria-pressed="false" title="Zaczernij – usuwa tekst pod spodem z pliku"><svg class="ep-icon" aria-hidden="true"><use href="#i-redact"/></svg><span>Zaczernij</span></button>
  </div>
  <span class="ep-toolbar__sep" aria-hidden="true"></span>
  <div class="ep-toolgroup" role="group" aria-label="Formularz">
    <button class="ep-tool t" data-tool="field" aria-pressed="false" title="Pole tekstowe formularza"><svg class="ep-icon" aria-hidden="true"><use href="#i-field"/></svg><span>Pole</span></button>
    <button class="ep-tool t" data-tool="check" aria-pressed="false" title="Pole wyboru formularza"><svg class="ep-icon" aria-hidden="true"><use href="#i-checkbox"/></svg><span>Checkbox</span></button>
    <button class="ep-tool t" data-tool="link" aria-pressed="false" title="Łącze do strony WWW"><svg class="ep-icon" aria-hidden="true"><use href="#i-link"/></svg><span>Łącze</span></button>
  </div>
  <span class="ep-toolbar__spacer"></span>
  <button class="ep-iconbtn" id="bSide" aria-label="Panel stron" title="Panel stron (F4)" aria-pressed="true"><svg class="ep-icon" aria-hidden="true"><use href="#i-panel-left"/></svg></button>
  <button class="ep-iconbtn" id="bProps" aria-label="Panel właściwości" title="Panel właściwości" aria-pressed="false"><svg class="ep-icon" aria-hidden="true"><use href="#i-panel-right"/></svg></button>
</div>
<div class="ep-shell__body">
  <aside class="ep-sidebar side on" id="side" aria-label="Panel boczny">
    <div class="ep-sidebar__head"><div class="ep-segmented tabs" role="tablist" aria-label="Panel boczny">
      <button class="ep-segmented__item" role="tab" data-pane="pThumbs" aria-selected="true">Strony</button>
      <button class="ep-segmented__item" role="tab" data-pane="pComments" aria-selected="false">Komentarze<span class="ep-segmented__count" id="nComments"></span></button>
      <button class="ep-segmented__item" role="tab" data-pane="pForm" aria-selected="false">Formularz</button>
    </div></div>
    <div class="ep-thumbs pane" id="pThumbs" role="tabpanel"></div>
    <div class="pane" id="pComments" role="tabpanel" hidden><div class="m">Brak komentarzy. Użyj narzędzia „Komentarz”.</div></div>
    <div class="pane" id="pForm" role="tabpanel" hidden></div>
  </aside>
  <main class="ep-canvas doc" id="doc" tabindex="0">
    <div class="pages" id="pages"></div>
    <div class="welcome" id="welcome">
      <div class="box">
        <h1>Edytor PDF</h1>
        <div>Otwórz plik PDF, żeby edytować tekst, dodawać obrazy, podpisy, komentarze, pola formularza albo zmieniać strony.</div>
        <div class="btns"><button class="ep-btn ep-btn--primary" id="bOpenW">Otwórz plik PDF…</button><button class="ep-btn" id="bNewW">Nowy pusty dokument</button><button class="ep-btn" id="bImgW">PDF z obrazów…</button></div>
        <div class="m">albo przeciągnij plik PDF na to okno</div>
        <div class="rec" id="recent"></div>
      </div>
    </div>
  </main>
  <aside class="ep-inspector props" id="props" aria-label="Właściwości">
    <div class="ep-inspector__head"><svg class="ep-icon" aria-hidden="true" id="propsIcon"><use href="#i-settings"/></svg><h2 class="ep-inspector__title" id="propsTitle">Właściwości</h2><button class="ep-iconbtn ep-iconbtn--sm" id="bPropsClose" aria-label="Zamknij panel" title="Zamknij panel"><svg class="ep-icon" aria-hidden="true"><use href="#i-close"/></svg></button></div>
    <div class="ep-inspector__body" id="propsBody"></div>
  </aside>
</div>
<footer class="ep-statusbar">
  <span class="ep-statusbar__mode" id="stTool" style="flex:none"></span><span id="stInfo" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis"></span>
  <span id="stRight" style="flex:none"></span>
  <div class="ep-pagenav" role="group" aria-label="Strony">
    <button class="ep-iconbtn ep-iconbtn--sm" id="bPrev" aria-label="Poprzednia strona"><svg class="ep-icon" aria-hidden="true"><use href="#i-prev"/></svg></button>
    <label class="ep-numfield"><input type="number" id="pageNo" min="1" value="1" aria-label="Numer strony" inputmode="numeric"><span id="pageCount">/ 0</span></label>
    <button class="ep-iconbtn ep-iconbtn--sm" id="bNext" aria-label="Następna strona"><svg class="ep-icon" aria-hidden="true"><use href="#i-next"/></svg></button>
  </div>
  <span class="ep-statusbar__sep" aria-hidden="true"></span>
  <div class="ep-zoom" role="group" aria-label="Powiększenie">
    <button class="ep-iconbtn ep-iconbtn--sm" id="zOut" aria-label="Pomniejsz" title="Pomniejsz (Ctrl −)"><svg class="ep-icon" aria-hidden="true"><use href="#i-minus"/></svg></button>
    <select class="ep-select ep-select--sm ep-select--mono" id="zoom" aria-label="Powiększenie"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="fitw">Szerokość</option><option value="fitp">Cała strona</option></select>
    <button class="ep-iconbtn ep-iconbtn--sm" id="zIn" aria-label="Powiększ" title="Powiększ (Ctrl +)"><svg class="ep-icon" aria-hidden="true"><use href="#i-plus"/></svg></button>
    <button class="ep-iconbtn ep-iconbtn--sm" id="zFit" aria-label="Dopasuj do szerokości" title="Dopasuj do szerokości (Ctrl 0)"><svg class="ep-icon" aria-hidden="true"><use href="#i-fit"/></svg></button>
  </div>
  <span class="ep-statusbar__sep" aria-hidden="true" id="stVersionSep" hidden></span>
  <span class="ep-version" id="stVersion" hidden></span>
</footer>
</div>

<div class="menu" id="mPlik">
  <button data-cmd="open">Otwórz…<span class="k">Ctrl O</span></button>
  <button data-cmd="new">Nowy pusty dokument</button>
  <button data-cmd="fromImages">Utwórz PDF z obrazów…</button>
  <hr>
  <button data-cmd="save">Zapisz<span class="k">Ctrl S</span></button>
  <button data-cmd="saveAs">Zapisz jako…<span class="k">Ctrl Shift S</span></button>
  <button data-cmd="exportPng">Zapisz bieżącą stronę jako PNG</button>
  <button data-cmd="print">Drukuj…<span class="k">Ctrl P</span></button>
  <hr>
  <button data-cmd="props">Właściwości dokumentu…</button>
  <button data-cmd="close">Zamknij dokument</button>
</div>
<div class="menu" id="mEdycja">
  <button data-cmd="undo">Cofnij<span class="k">Ctrl Z</span></button>
  <button data-cmd="redo">Ponów<span class="k">Ctrl Y</span></button>
  <hr>
  <button data-cmd="selectAllText">Zaznacz cały tekst strony<span class="k">Ctrl A</span></button>
  <button data-cmd="copyText">Kopiuj zaznaczony tekst<span class="k">Ctrl C</span></button>
  <button data-cmd="delete">Usuń zaznaczony obiekt<span class="k">Del</span></button>
  <button data-cmd="duplicate">Powiel zaznaczony obiekt<span class="k">Ctrl D</span></button>
  <hr>
  <button data-cmd="apply">Wtop obiekty w dokument</button>
  <button data-cmd="find">Szukaj…<span class="k">Ctrl F</span></button>
</div>
<div class="menu" id="mWidok">
  <button data-cmd="zoomIn">Powiększ<span class="k">Ctrl +</span></button>
  <button data-cmd="zoomOut">Pomniejsz<span class="k">Ctrl −</span></button>
  <button data-cmd="fitw">Dopasuj do szerokości<span class="k">Ctrl 0</span></button>
  <button data-cmd="fitp">Cała strona</button>
  <hr>
  <button data-cmd="toggleSide">Panel stron<span class="k">F4</span></button>
  <button data-cmd="toggleProps">Panel właściwości</button>
  <hr>
  <div class="lab">Wygląd</div>
  <div class="ep-segmented ep-thememode" role="radiogroup" aria-label="Wygląd" data-ep-theme-mode>
    <button class="ep-segmented__item" role="radio" data-mode="papier" aria-checked="false"><svg class="ep-icon ep-icon--sm" aria-hidden="true"><use href="#i-sun"/></svg>Jasny</button>
    <button class="ep-segmented__item" role="radio" data-mode="grafit" aria-checked="false"><svg class="ep-icon ep-icon--sm" aria-hidden="true"><use href="#i-moon"/></svg>Ciemny</button>
    <button class="ep-segmented__item" role="radio" data-mode="auto" aria-checked="true"><svg class="ep-icon ep-icon--sm" aria-hidden="true"><use href="#i-monitor"/></svg>Jak w systemie</button>
  </div>
</div>
<div class="menu" id="mStrony">
  <button data-cmd="rotL">Obróć stronę w lewo</button>
  <button data-cmd="rotR">Obróć stronę w prawo</button>
  <button data-cmd="delPage">Usuń stronę</button>
  <button data-cmd="dupPage">Powiel stronę</button>
  <hr>
  <button data-cmd="insBlank">Wstaw pustą stronę…</button>
  <button data-cmd="insPdf">Wstaw strony z innego PDF…</button>
  <button data-cmd="extract">Wyodrębnij strony do nowego PDF…</button>
  <button data-cmd="split">Podziel dokument…</button>
  <hr>
  <button data-cmd="crop">Przytnij stronę…</button>
  <button data-cmd="resize">Zmień rozmiar strony…</button>
</div>
<div class="menu" id="mNarz">
  <button data-cmd="pageNumbers">Numeracja stron…</button>
  <button data-cmd="watermark">Znak wodny…</button>
  <button data-cmd="headerFooter">Nagłówek i stopka…</button>
  <hr>
  <button data-cmd="flatten">Spłaszcz formularz (na stałe)</button>
  <button data-cmd="removeAnnots">Usuń wszystkie komentarze i adnotacje</button>
  <button data-cmd="extractText">Wyodrębnij cały tekst…</button>
  <button data-cmd="extractImages">Wyodrębnij obrazy (ZIP)</button>
</div>
<div class="menu" id="mPomoc">
  <button data-cmd="help">Jak używać edytora</button>
  <button data-cmd="shortcuts">Skróty klawiszowe</button>
  <button data-cmd="about">O programie</button>
</div>
<input type="file" id="fOpen" accept="application/pdf,.pdf" hidden>
<input type="file" id="fImg" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>
<input type="file" id="fImgs" accept="image/png,image/jpeg,.png,.jpg,.jpeg" multiple hidden>
<input type="file" id="fPdf2" accept="application/pdf,.pdf" hidden>
<div class="toast" id="toast" role="status"></div>
<script id="s-kod">/*KOD*/</script>
</body>
</html>
