<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edytor PDF</title>
<style>
/* ---- czcionki do nowego tekstu (te same, które trafiają do PDF-a) ---- */
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-Bold.ttf);font-weight:700;font-style:normal}
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:"Liberation Sans";src:url(czcionki/LiberationSans-BoldItalic.ttf);font-weight:700;font-style:italic}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-Bold.ttf);font-weight:700;font-style:normal}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:"Liberation Serif";src:url(czcionki/LiberationSerif-BoldItalic.ttf);font-weight:700;font-style:italic}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-Regular.ttf);font-weight:400;font-style:normal}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-Bold.ttf);font-weight:700;font-style:normal}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-Italic.ttf);font-weight:400;font-style:italic}
@font-face{font-family:"Liberation Mono";src:url(czcionki/LiberationMono-BoldItalic.ttf);font-weight:700;font-style:italic}
/* ---- kolory i podstawy ---- */
:root{--bg:#e9e8e3;--panel:#f4f3ef;--card:#fff;--ink:#1d1d1b;--mut:#6b6a64;--line:#d9d7ce;--top:#1d1d1b;--acc:#1f5f99;--acc2:#2d6a12;--warn:#a32d2d;--sel:#1f5f99;--hl:#fff176}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
/* ---- górny pasek ---- */
.top{background:var(--top);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px;height:44px;flex-shrink:0}
.top b{font-size:16px;font-weight:600;margin-right:8px;white-space:nowrap}
.top .fn{color:#cfcdc4;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.top nav{display:flex;gap:2px}
.top nav>button,.top .tb{background:transparent;color:#fff;border:0;padding:7px 10px;border-radius:7px;font-size:14px}
.top nav>button:hover,.top .tb:hover{background:#ffffff22}
.top .tb.go{background:var(--acc2);font-weight:600;padding:7px 14px}.top .tb.go:hover{background:#3a8619}
/* ---- menu rozwijane ---- */
.menu{position:fixed;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 40px #0004;padding:6px;min-width:230px;z-index:300;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;text-align:left;background:transparent;border:0;padding:7px 10px;border-radius:7px;gap:10px;align-items:center;font-size:14px}
.menu button:hover:not(:disabled){background:var(--panel)}
.menu button span.k{margin-left:auto;color:var(--mut);font-size:12px}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 4px}
/* ---- pasek narzędzi ---- */
.tools{background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:3px;padding:5px 8px;flex-shrink:0;flex-wrap:wrap;min-height:46px}
.tools .g{display:flex;gap:2px;align-items:center;padding:0 6px;border-right:1px solid var(--line)}
.tools .g:last-child{border-right:0}
.tools button.t{display:flex;flex-direction:column;align-items:center;gap:1px;background:transparent;border:1px solid transparent;border-radius:8px;padding:3px 7px;font-size:11px;color:var(--ink);min-width:50px;line-height:1.2}
.tools button.t:hover{background:#fff;border-color:var(--line)}
.tools button.t.on{background:#dbe8f5;border-color:#9dbbd9;color:#0f3f6e}
.tools .z{display:flex;align-items:center;gap:4px;margin-left:auto}
.tools .z button,.tools .z select,.tools .z input{background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 8px;height:30px}
.tools .z input[type=number]{width:58px;text-align:center}
.tools .z input.s{width:170px}
/* ---- układ: panel boczny / dokument / właściwości ---- */
.main{display:flex;flex:1;min-height:0}
.side{width:200px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
.side.hid{display:none}
.side .tabs{display:flex;border-bottom:1px solid var(--line)}
.side .tabs button{flex:1;background:transparent;border:0;padding:8px 4px;font-size:12px;border-bottom:2px solid transparent;color:var(--mut)}
.side .tabs button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
.side .pane{flex:1;overflow:auto;padding:10px;display:none}.side .pane.on{display:block}
.thumb{margin:0 auto 12px;width:150px;cursor:pointer;text-align:center;font-size:12px;color:var(--mut);position:relative}
.thumb canvas{display:block;width:100%;border:2px solid var(--line);border-radius:4px;background:#fff;box-shadow:0 1px 4px #0002}
.thumb.cur canvas{border-color:var(--acc)}.thumb.sel canvas{outline:3px solid #f0b429}
.thumb.drag{opacity:.4}.thumb.over canvas{box-shadow:0 -4px 0 var(--acc)}
.thumb .n{margin-top:3px}
.doc{flex:1;overflow:auto;position:relative;background:var(--bg);outline:none}
.doc .pages{padding:24px 0 60px;display:flex;flex-direction:column;align-items:center;gap:18px;min-width:min-content}
.page{position:relative;background:#fff;box-shadow:0 2px 10px #0003;flex-shrink:0}
.page canvas.pg{display:block}
.page .tl{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:.25}
.page .tl span{position:absolute;white-space:pre;color:transparent;transform-origin:0 0}
.page .tl ::selection{background:#1f5f9988}
.page .tl .hit{background:#ffd54f;color:transparent;opacity:1;border-radius:2px}
.page .txl,.page .lay{position:absolute;inset:0}.page .txl{pointer-events:none}
.page.rendering::after{content:"";position:absolute;inset:0;background:#fff8}
.doc.hand .page{cursor:grab}.doc.hand.dragging .page{cursor:grabbing}
/* pola edycji istniejącego tekstu */
.page .tx{position:absolute;outline:1px dashed transparent;cursor:text;pointer-events:none}.page .tx.moving{outline:2px solid #1f5f99;background:#1f5f9922;cursor:move;z-index:5}
.page.edit-text .tx{pointer-events:auto}
.page.edit-text .tx:hover{outline-color:#1f5f99;background:#1f5f9911}
.page .tx.off{cursor:not-allowed}.page.edit-text .tx.off:hover{outline-color:#a32d2d;background:#a32d2d11}
.inl{position:absolute;outline:2px solid var(--acc);background:#fff;white-space:pre;z-index:20;padding:0;margin:0;line-height:1;min-width:20px;transform-origin:0 0;user-select:text}
/* obiekty na stronie (warstwa) */
.page .ob{position:absolute;transform-origin:0 0}
.page .ob.sel{outline:1.5px solid var(--sel)}
.page .ob .h{position:absolute;width:10px;height:10px;background:#fff;border:1.5px solid var(--sel);border-radius:2px;display:none}
.page .ob.sel .h{display:block}
.page .ob .h.nw{left:-6px;top:-6px;cursor:nwse-resize}.page .ob .h.ne{right:-6px;top:-6px;cursor:nesw-resize}
.page .ob .h.sw{left:-6px;bottom:-6px;cursor:nesw-resize}.page .ob .h.se{right:-6px;bottom:-6px;cursor:nwse-resize}
.page .ob .h.e{right:-6px;top:calc(50% - 5px);cursor:ew-resize}.page .ob .h.w{left:-6px;top:calc(50% - 5px);cursor:ew-resize}
.page .ob.text .ed{outline:0;white-space:pre-wrap;word-break:break-word;width:100%;height:100%;overflow:hidden;cursor:text;user-select:text}
.page .ob img{width:100%;height:100%;display:block;pointer-events:none}
.page .ob svg{width:100%;height:100%;display:block;overflow:visible;pointer-events:none}
.page .ob.note{width:22px;height:22px}
.page .ob.note svg{pointer-events:auto;cursor:pointer}
.page .ob.field{border:1px solid #6b8fbf;background:#dbe8f566}
.page .ob.field.chk::after{content:"☐";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#345}
.doc.drawing .page{cursor:crosshair}
.rub{position:absolute;border:1px dashed var(--acc);background:#1f5f9918;pointer-events:none}
/* panel właściwości */
.props{width:230px;background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto;flex-shrink:0;display:none}
.props.on{display:block}
.props h3{font-size:13px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px}
.props label{display:block;font-size:12px;color:var(--mut);margin:8px 0 2px}
.props input,.props select,.props textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:7px;padding:5px 8px}
.props input[type=color]{padding:2px;height:32px}
.props .row{display:flex;gap:6px}.props .row>*{flex:1}
.props button{background:#fff;border:1px solid var(--line);border-radius:7px;padding:6px 10px;margin-top:8px;width:100%}
.props button.x{color:var(--warn)}.props button.go{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.props button.on{background:#dbe8f5;border-color:#9dbbd9}
/* pasek stanu */
.status{background:var(--panel);border-top:1px solid var(--line);padding:3px 12px;font-size:12px;color:var(--mut);display:flex;gap:16px;flex-shrink:0;min-height:24px}
.status .r{margin-left:auto}
/* ekran powitalny */
.welcome{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--mut)}
.welcome .box{background:#fff;border:2px dashed var(--line);border-radius:18px;padding:40px 60px;text-align:center;max-width:520px}
.welcome h1{font-size:24px;margin:0 0 6px;color:var(--ink)}
.welcome .btn{display:inline-block;background:var(--acc);color:#fff;border:0;padding:12px 22px;border-radius:10px;font-size:16px;font-weight:600;margin-top:16px}
.welcome .btn.s{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.welcome ul{text-align:left;margin:16px 0 0;padding-left:18px;font-size:13px}
.welcome .rec{margin-top:14px;font-size:13px;text-align:left}.welcome .rec a{display:block;color:var(--acc);cursor:pointer;text-decoration:none;padding:2px 0}
.doc.dropping::after{content:"Upuść plik PDF tutaj";pointer-events:none;position:fixed;inset:8px;border:3px dashed var(--acc);border-radius:14px;background:#1f5f9922;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--acc);z-index:50}
/* okna dialogowe */
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:400;padding:16px}
.box{background:#fff;border-radius:14px;width:min(600px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 50px #0006}
.box h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:17px}
.box .b{padding:14px 18px;overflow:auto;user-select:text}
.box .f{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.box button{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 16px}
.box button.go{background:var(--acc2);color:#fff;border-color:var(--acc2)}.box button.x{color:var(--warn)}
.box label{display:block;font-size:12px;color:var(--mut);margin:10px 0 3px}
.box input,.box select,.box textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
.box textarea{min-height:90px;resize:vertical}
.box .row{display:flex;gap:10px}.box .row>*{flex:1}
.box .m{color:var(--mut);font-size:13px}
.box canvas.sig{border:1px solid var(--line);border-radius:8px;background:#fff;width:100%;cursor:crosshair;touch-action:none}
.box .tabs{display:flex;gap:4px;margin-bottom:10px}.box .tabs button{flex:1}.box .tabs button.on{background:#dbe8f5;border-color:#9dbbd9}
.fld{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.fld span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fld input,.fld select{flex:1.3;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:#fff;min-width:0}
.com{padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff;cursor:pointer;font-size:13px}
.com b{display:block;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:#1d1d1b;color:#fff;padding:10px 18px;border-radius:10px;z-index:500;box-shadow:0 6px 30px #0006;max-width:80vw;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.err{background:var(--warn)}
.kbd{font:12px ui-monospace,monospace;background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media print{body>*{display:none!important}}
</style>
<script src="lib/pdf-lib.min.js"></script>
<script src="lib/fontkit.umd.min.js"></script>
<script src="lib/pdf.min.js"></script>
<script src="lib/pdf.worker.js"></script>
<script src="lib/jszip.min.js"></script><script src="lib/qpdf.js"></script>
</head>
<body><script src="desktop-shim.js"></script>
<div class="top">
  <b>Edytor PDF</b>
  <nav>
    <button data-menu="mPlik">Plik</button>
    <button data-menu="mEdycja">Edycja</button>
    <button data-menu="mWidok">Widok</button>
    <button data-menu="mStrony">Strony</button>
    <button data-menu="mNarz">Narzędzia</button>
    <button data-menu="mPomoc">Pomoc</button>
  </nav>
  <span class="fn" id="fileName"></span>
  <nav><button class="tb" id="bUndo" title="Cofnij (Ctrl+Z)" disabled>↶</button><button class="tb" id="bRedo" title="Ponów (Ctrl+Y)" disabled>↷</button><button class="tb go" id="bSave" disabled>Zapisz</button></nav>
</div>
<div class="tools" id="tools">
  <div class="g">
    <button class="t on" data-tool="select" title="Zaznaczanie i przesuwanie obiektów (V)"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L16 20l-3 1.5-3-6.5L5 19z"/></svg>Zaznacz</button>
    <button class="t" data-tool="hand" title="Przesuwanie widoku (H)"><svg class="i" viewBox="0 0 24 24"><path d="M8 13V5a1.5 1.5 0 013 0v6m0-7a1.5 1.5 0 013 0v7m0-5a1.5 1.5 0 013 0v8a6 6 0 01-12 0v-3a1.5 1.5 0 013 0"/></svg>Łapka</button>
  </div>
  <div class="g">
    <button class="t" data-tool="edittext" title="Edytuj istniejący tekst w dokumencie (T)"><svg class="i" viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16m-3 0h6"/></svg>Edytuj tekst</button>
    <button class="t" data-tool="text" title="Dodaj nowe pole tekstowe"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9h8M12 9v6"/></svg>Dodaj tekst</button>
    <button class="t" data-tool="image" title="Wstaw obraz (PNG, JPG)"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>Obraz</button>
    <button class="t" data-tool="sig" title="Podpis"><svg class="i" viewBox="0 0 24 24"><path d="M3 17c3-6 5-9 7-9s0 10 3 10 2-6 4-6 1 4 4 4M3 21h18"/></svg>Podpis</button>
  </div>
  <div class="g">
    <button class="t" data-tool="hl" title="Zakreśl tekst (zaznacz tekst myszą)"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h16M6 16l9-9 3 3-9 9H6z"/></svg>Zakreśl</button>
    <button class="t" data-tool="ul" title="Podkreśl tekst"><svg class="i" viewBox="0 0 24 24"><path d="M7 4v7a5 5 0 0010 0V4M5 20h14"/></svg>Podkreśl</button>
    <button class="t" data-tool="st" title="Przekreśl tekst"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M8 6c0-1 2-2 4-2s4 1 4 3M8 18c0 1 2 2 4 2s4-1 4-3"/></svg>Przekreśl</button>
    <button class="t" data-tool="note" title="Komentarz (notatka)"><svg class="i" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Komentarz</button>
  </div>
  <div class="g">
    <button class="t" data-tool="draw" title="Rysuj odręcznie"><svg class="i" viewBox="0 0 24 24"><path d="M3 21c4-1 3-6 7-7s4 4 7 2 2-7 4-9M3 21l2-6"/></svg>Rysuj</button>
    <button class="t" data-tool="rect" title="Prostokąt"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>Prostokąt</button>
    <button class="t" data-tool="ellipse" title="Elipsa"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6"/></svg>Elipsa</button>
    <button class="t" data-tool="line" title="Linia"><svg class="i" viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg>Linia</button>
    <button class="t" data-tool="arrow" title="Strzałka"><svg class="i" viewBox="0 0 24 24"><path d="M4 20L20 4m0 0h-7m7 0v7"/></svg>Strzałka</button>
  </div>
  <div class="g">
    <button class="t" data-tool="white" title="Wymaż (zakryj białym)"><svg class="i" viewBox="0 0 24 24"><path d="M3 17l8-8 6 6-5 5H7zM11 9l5-5 6 6-5 5"/></svg>Wymaż</button>
    <button class="t" data-tool="redact" title="Zaczernij i usuń tekst pod spodem"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" fill="currentColor"/></svg>Zaczernij</button>
    <button class="t" data-tool="field" title="Pole tekstowe formularza"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 11v2"/></svg>Pole</button>
    <button class="t" data-tool="check" title="Pole wyboru formularza"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 12l3 3 5-6"/></svg>Checkbox</button>
    <button class="t" data-tool="link" title="Łącze (link do strony WWW)"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1.5 1.5M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1.5-1.5"/></svg>Łącze</button>
  </div>
  <div class="z">
    <input class="s" id="search" placeholder="Szukaj w dokumencie… (Ctrl+F)"><span id="searchN" style="font-size:12px;color:var(--mut);min-width:48px"></span>
    <button id="bPrev" title="Poprzednia strona">◀</button><input type="number" id="pageNo" min="1" value="1"><span id="pageCount" style="font-size:12px;color:var(--mut)">/ 0</span><button id="bNext" title="Następna strona">▶</button>
    <button id="zOut" title="Pomniejsz (Ctrl −)">−</button><select id="zoom"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option><option value="fitw">Dopasuj szerokość</option><option value="fitp">Cała strona</option></select><button id="zIn" title="Powiększ (Ctrl +)">+</button>
  </div>
</div>
<div class="main">
  <div class="side" id="side">
    <div class="tabs"><button class="on" data-pane="pThumbs">Strony</button><button data-pane="pComments">Komentarze</button><button data-pane="pForm">Formularz</button></div>
    <div class="pane on" id="pThumbs"></div>
    <div class="pane" id="pComments"><div class="m" style="font-size:12px;color:var(--mut)">Brak komentarzy. Użyj narzędzia „Komentarz”.</div></div>
    <div class="pane" id="pForm"></div>
  </div>
  <div class="doc" id="doc" tabindex="0">
    <div class="pages" id="pages"></div>
    <div class="welcome" id="welcome">
      <div class="box">
        <h1>Edytor PDF</h1>
        <div>Otwórz plik PDF, żeby edytować tekst, dodawać obrazy, podpisy, komentarze, pola formularza albo zmieniać strony.</div>
        <button class="btn" id="bOpenW">Otwórz plik PDF…</button> <button class="btn s" id="bNewW">Nowy pusty dokument</button> <button class="btn s" id="bImgW">PDF z obrazów…</button>
        <div class="m" style="margin-top:10px;font-size:13px">albo przeciągnij plik PDF na to okno</div>
        <div class="rec" id="recent"></div>
      </div>
    </div>
  </div>
  <div class="props" id="props"></div>
